<button class="music order" id="order" type="button" aria-label="Барная карта" aria-haspopup="dialog">
    <svg class="disc" viewBox="0 0 30 30" aria-hidden="true" focusable="false">
      <circle cx="15" cy="15" r="14" fill="#120a0b" stroke="rgba(214,170,92,.6)"/>
      <path d="M8 9H22L15 17Z" fill="#b3263e" stroke="#f1e4cc" stroke-width="1" stroke-linejoin="round"/>
      <path d="M15 17V23M11.5 23H18.5" stroke="#f1e4cc" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="19.5" cy="9.5" r="1.7" fill="#ffd27a"/>
    </svg>
    <span class="label">Барная карта</span>
  </button>
  <button class="music" id="music" type="button" aria-label="Включить музыку">
    <svg class="disc" viewBox="0 0 30 30" aria-hidden="true" focusable="false">
      <circle cx="15" cy="15" r="14" fill="#120a0b" stroke="rgba(214,170,92,.6)"/>
      <circle cx="15" cy="15" r="10.5" fill="none" stroke="rgba(255,255,255,.12)"/>
      <circle cx="15" cy="15" r="7.5" fill="none" stroke="rgba(255,255,255,.1)"/>
      <circle cx="15" cy="15" r="4.6" fill="#b3263e"/>
      <circle cx="15" cy="15" r="1.2" fill="#f1e4cc"/>
      <path d="M6.5 9a11 11 0 0 1 5.5-4" stroke="rgba(255,255,255,.35)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
    </svg>
    <span class="label">Включить музыку</span>
  </button>

  
  <div class="tools" id="tools" role="group" aria-label="Плеер, журнал и настройки">
    <button class="tool" id="t-friends" type="button" aria-label="Кто в баре" aria-haspopup="dialog" title="Кто в баре">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="8.5" cy="8" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="16.5" cy="9" r="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3 19c.6-3.2 2.9-5 5.5-5s4.9 1.8 5.5 5M14.5 14.6c.6-.3 1.3-.5 2-.5 2.2 0 4 1.5 4.5 4.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <i class="tool-count" id="t-friends-n" hidden></i>
    </button>
    <button class="tool" id="t-photo" type="button" aria-label="Фото на память" aria-haspopup="dialog" title="Фото на память">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 8.5A1.5 1.5 0 0 1 5.5 7h2.2l1.3-2h6l1.3 2h2.2A1.5 1.5 0 0 1 20 8.5v9a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 17.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <button class="tool" id="t-player" type="button" aria-label="Музыкальный плеер" aria-haspopup="dialog" title="Музыкальный плеер">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9 17.5V6l10-2v11.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="6.6" cy="17.5" r="2.4" fill="currentColor"/><circle cx="16.6" cy="15.5" r="2.4" fill="currentColor"/></svg>
    </button>
    <button class="tool" id="t-journal" type="button" aria-label="Журнал: секреты и достижения" aria-haspopup="dialog" title="Журнал: секреты и достижения">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3.5h10.5a1.5 1.5 0 0 1 1.5 1.5v15H7.5A1.5 1.5 0 0 1 6 18.5z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 18.5A1.5 1.5 0 0 1 7.5 17H18" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 7.2l.9 1.9 2 .3-1.5 1.4.4 2-1.8-1-1.8 1 .4-2-1.5-1.4 2-.3z" fill="currentColor"/></svg>
      <i class="tool-dot" id="t-journal-dot" hidden></i>
    </button>
    <button class="tool" id="t-hop" type="button" aria-label="Бары сети" aria-haspopup="dialog" title="Бары сети" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3.5" y="8" width="17" height="10" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M3.5 11h17" stroke="currentColor" stroke-width="1.2" stroke-dasharray="1.4 1.2"/><path d="M8 8V5.6M8 5.6c0-1 1.4-1.4 1.4-.2" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="4.6" r="1.2" fill="currentColor"/></svg>
    </button>
    <button class="tool" id="t-settings" type="button" aria-label="Настройки" aria-haspopup="dialog" title="Настройки">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 7h9M17 7h3M4 17h3M11 17h9M4 12h4M12 12h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><circle cx="15" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="9" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </div>
