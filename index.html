<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hacheden</title>
<meta name="description" content="Бар Hacheden в 3D: стойка, курилка с камином и читальня с книгами.">
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Literata:opsz,wght@7..72,400..600&display=swap" rel="stylesheet">
<style>
/* Бар тёмный в любом режиме: те же значения для светлой и тёмной темы. */
  :root {
    color-scheme: dark;
    --brass: #d6aa5c;
    --cream: #f1e4cc;
    --muted: #c2a784;
    --walnut: #4a2c1a;
    --font-display: "Forum", "Palatino Linotype", Georgia, serif;
    --font-text: "Literata", Georgia, "Times New Roman", serif;
    --bh: clamp(92px, 15svh, 168px);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  :root[data-theme="dark"] { color-scheme: dark; }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: #070304; }
  body { height: 100%; margin: 0; background: #070304; color: var(--cream); font-family: var(--font-text); overflow-x: hidden; }

  
/* ---------- переходы между комнатами ---------- */
  .go { position: absolute; bottom: 18px; z-index: 4; display: flex; align-items: center; gap: 8px;
    padding: 12px 16px 12px 12px; border: 1px solid rgba(214,170,92,.5); border-radius: 999px;
    background: rgba(14,5,8,.72); color: var(--cream); font: 400 17px/1 var(--font-display); cursor: pointer;
    opacity: 0; animation: fade-in .9s 3.4s forwards; transition: border-color .2s, color .2s; }
  .go svg { width: 18px; height: 18px; }
  .go:hover { border-color: var(--brass); color: var(--brass); }
  .go:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  .go-left { left: 18px; }
  .go-right { right: 18px; flex-direction: row-reverse; padding: 12px 12px 12px 16px; }
  .go.off { visibility: hidden; pointer-events: none; }

  
/* ---------- музыка ---------- */
  .music { position: absolute; top: 18px; right: 18px; z-index: 4; display: flex; align-items: center; gap: 10px;
    padding: 8px 16px 8px 8px; border: 1px solid rgba(214,170,92,.5); border-radius: 999px;
    background: rgba(14,5,8,.72); color: var(--cream); font: 400 17px/1 var(--font-display); cursor: pointer;
    opacity: 0; animation: fade-in .9s 3.4s forwards; transition: border-color .2s, color .2s; }
  .music:hover { border-color: var(--brass); color: var(--brass); }
  .music:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  .music.on { border-color: var(--brass); }
  .disc { width: 30px; height: 30px; flex: none; }
  .music.on .disc { animation: spin 3.2s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .order { left: 18px; right: auto; }
  .served { position: absolute; bottom: calc(100% - 14px); width: 40px; transform: translateX(-50%); pointer-events: none; }
  .served svg { display: block; width: 100%; height: auto; }
  .app.mixing .bottle.in svg { filter: drop-shadow(0 0 10px rgba(255,210,122,.95)); }
  .app.mixing .bottle.in .name { color: var(--brass); }

  /* ---------- барная карта ---------- */
  dialog.mix { position: fixed; inset: 0 0 0 auto; z-index: 8; margin: 0; padding: 0; border: 0;
    border-left: 1px solid rgba(214,170,92,.35); width: min(440px, 100%); height: 100%; max-height: 100%; overflow: auto;
    background: linear-gradient(180deg, rgba(38,12,19,.97), rgba(20,8,11,.98)); color: var(--cream);
    box-shadow: -20px 0 50px rgba(0,0,0,.5); }
  dialog.mix[open] { animation: slide-in .35s cubic-bezier(.2,.8,.2,1); }
  .mix-inner { padding: 22px 24px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .mix-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .mix-top h2 { margin: 0; font: 400 34px/1.1 var(--font-display); }
  .mix-top .close { top: 0; }
  .tabs { display: flex; gap: 4px; width: fit-content; margin: 16px 0 4px; padding: 4px;
    border: 1px solid rgba(214,170,92,.3); border-radius: 999px; }
  .tab { appearance: none; border: 0; background: none; color: var(--muted); font: 400 17px/1 var(--font-display);
    padding: 9px 18px; border-radius: 999px; cursor: pointer; }
  .tab[aria-selected="true"] { background: rgba(214,170,92,.2); color: var(--cream); }
  .mix h3 { margin: 24px 0 10px; font: 400 20px/1.2 var(--font-display); color: var(--brass); }
  .mix-note { margin: 12px 0 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { appearance: none; border: 1px solid rgba(214,170,92,.35); background: rgba(255,255,255,.03); color: var(--cream);
    font: 400 15px/1 var(--font-text); padding: 9px 13px; border-radius: 999px; cursor: pointer; transition: background .2s, border-color .2s; }
  .chip:hover { border-color: var(--brass); }
  .chip[aria-pressed="true"] { background: rgba(214,170,92,.24); border-color: var(--brass); }
  .chip:focus-visible, .tab:focus-visible, .make:focus-visible, .clear:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .drinks { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .drink { display: grid; grid-template-columns: 30px 1fr auto; align-items: center; gap: 12px; padding: 10px 12px;
    border-radius: 10px; background: rgba(255,255,255,.035); }
  .drink > svg { width: 30px; height: 43px; }
  .drink b { display: block; font: 400 19px/1.2 var(--font-display); }
  .drink span { display: block; margin-top: 3px; color: var(--muted); font-size: 13.5px; line-height: 1.4; }
  .drink .miss { color: #eab0bc; }
  /* фирменный коктейль: латунная рамка и тёплое свечение */
  .drinks.sig .drink { background: linear-gradient(100deg, rgba(214,170,92,.16), rgba(160,40,20,.12)); box-shadow: inset 0 0 0 1px rgba(214,170,92,.55), 0 0 22px rgba(255,120,40,.12); }
  .drinks.sig .drink b { color: #ffe0b0; }
  .drink .sig-note { color: var(--brass); font-style: italic; }
  h3.sig { color: var(--brass); }
  .make { appearance: none; border: 1px solid var(--brass); background: rgba(214,170,92,.14); color: var(--cream);
    font: 400 15px/1 var(--font-display); padding: 9px 12px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .make:hover { background: rgba(214,170,92,.3); }
  .make.ghost { border-color: rgba(214,170,92,.45); background: none; }
  .empty { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.5; }
  .clear { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 14px;
    text-decoration: underline; cursor: pointer; padding: 6px 0; margin-top: 16px; }
  .recipe li b { color: var(--brass); font-weight: 600; }
  /* конструктор: подача и кнопка «Смешать» */
  .serve-row { display: grid; grid-template-columns: 62px 1fr; gap: 10px; align-items: start; margin-top: 10px; }
  .serve-row > span { padding-top: 9px; color: var(--muted); font-size: 13.5px; }
  .serve-row .chip { padding: 8px 11px; font-size: 14px; }
  .chip:disabled { opacity: .35; cursor: default; }
  .mix-note.small { font-size: 13px; margin-top: 10px; }
  .mix-go { position: sticky; bottom: 0; z-index: 2; margin: 10px -24px -40px; padding: 16px 24px calc(18px + env(safe-area-inset-bottom, 0px));
    background: rgba(23,8,11,.97); border-top: 1px solid rgba(214,170,92,.22); box-shadow: 0 -16px 26px rgba(12,4,6,.75); }
  .mix-preview { margin: 0 0 10px; color: var(--muted); font-size: 14px; line-height: 1.45; min-height: 20px; }
  .mix-preview b { color: var(--cream); font-weight: 600; }
  .make.big { width: 100%; padding: 14px 16px; font-size: 19px; background: linear-gradient(180deg, rgba(214,170,92,.42), rgba(160,110,40,.3)); box-shadow: 0 0 22px rgba(255,160,70,.18); }
  .make.big:hover { background: linear-gradient(180deg, rgba(214,170,92,.55), rgba(160,110,40,.4)); }
  .make:disabled { opacity: .45; cursor: default; box-shadow: none; }
  /* меню: поиск, разделы, избранное */
  .menu-tools { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 16px; }
  .menu-tools input, .menu-tools select, .mine-box input { min-width: 0; border: 1px solid rgba(214,170,92,.35); background: rgba(255,255,255,.04); color: var(--cream);
    font: 400 15px/1.2 var(--font-text); padding: 10px 12px; border-radius: 10px; }
  .menu-tools select { padding-right: 8px; }
  .menu-tools select option { background: #1c0a0e; }
  .menu-tools input:focus-visible, .menu-tools select:focus-visible, .mine-box input:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  .menu-tools input::placeholder { color: rgba(194,167,132,.7); }
  .chips.cats { margin-top: 12px; gap: 6px; }
  .chips.cats .chip { padding: 7px 11px; font-size: 13.5px; }
  #panel-menu .drink { grid-template-columns: 30px 1fr auto; row-gap: 8px; }
  #panel-menu .drink .acts { grid-column: 2 / -1; display: flex; gap: 6px; justify-content: flex-end; }
  #panel-menu .drink .acts .make { padding: 8px 12px; font-size: 14px; }
  .drink .meta { color: rgba(214,170,92,.85); font-size: 12.5px; }
  .drink .badge { display: inline-block; margin-left: 8px; padding: 2px 7px; border: 1px solid rgba(214,170,92,.45); border-radius: 999px;
    font: italic 400 11.5px/1.3 var(--font-text); color: var(--brass); vertical-align: 3px; }
  .fav { appearance: none; border: 0; background: none; color: var(--brass); font-size: 22px; line-height: 1; padding: 4px 6px; cursor: pointer; align-self: start; }
  .fav[aria-pressed="false"] { color: rgba(214,170,92,.55); }
  .fav:hover { color: #ffd890; }
  .fav:focus-visible { outline: 2px solid var(--brass); border-radius: 6px; }
  .secret-hint { margin-top: 26px; padding: 14px 16px; border: 1px dashed rgba(214,170,92,.4); border-radius: 12px; background: rgba(0,0,0,.18); }
  .secret-hint p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--muted); }
  .secret-hint b { color: var(--cream); font-weight: 600; }
  .secret-hint .hint-line { margin-top: 8px; color: #ecd2a4; font-style: italic; }
  .secret-hint .clear { margin-top: 6px; }
  /* карточка: тайный рецепт, свой коктейль */
  .found-note { margin: 0 0 6px; color: #ffd890; font: italic 400 15px/1.3 var(--font-text); letter-spacing: .02em; text-shadow: 0 0 14px rgba(255,170,80,.5); }
  .card-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .mine-box { display: grid; gap: 6px; margin-top: 20px; }
  .mine-box label { color: var(--muted); font-size: 13.5px; }
  .saved-note { margin: 10px 0 0; min-height: 18px; color: var(--brass); font-size: 14px; }

  /* ---------- крупный план: камера наезжает на стойку ---------- */
  .room-bar .scene { transform-origin: 50% 76%; transition: transform 1.15s cubic-bezier(.6,0,.25,1), filter 1.15s ease; }
  .app.cu .room-bar .scene { transform: scale(2.7); filter: blur(7px) brightness(.45); }
  .app.cu-hide .world { visibility: hidden; }
  .closeup { position: fixed; inset: 0; z-index: 9; overflow: hidden; opacity: 0; transform: scale(1.12); pointer-events: none;
    background: radial-gradient(ellipse at 50% 30%, #3a0e18 0%, #1a0609 55%, #090203 100%);
    transition: opacity .7s ease .45s, transform 1.25s cubic-bezier(.2,.7,.2,1) .35s; }
  .closeup.in { opacity: 1; transform: none; pointer-events: auto; }
  .closeup.out { opacity: 0; transform: scale(.97); transition: opacity .6s ease, transform .8s ease-in; }
  .cu-bokeh, .cu-svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .cu-title { position: absolute; top: 22px; left: 0; right: 0; margin: 0; padding: 0 140px; text-align: center; pointer-events: none;
    font: 400 clamp(26px, 4vw, 42px)/1.1 var(--font-display); letter-spacing: .04em; color: #ffe6ea;
    text-shadow: 0 0 4px #fff, 0 0 14px #ff5c7a, 0 0 30px #ff2a55; }
  .go.cu-skip { top: 18px; bottom: auto; right: 18px; padding: 11px 18px; opacity: 1; animation: none; }
  .cu-ui { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 16px calc(26px + env(safe-area-inset-bottom, 0px));
    text-align: center; pointer-events: none; background: linear-gradient(rgba(8,2,4,0), rgba(8,2,4,.82) 55%); }
  .cu-cap { margin: 0 auto; max-width: 760px; }
  .cu-cap.show { animation: cap-in .45s cubic-bezier(.2,.8,.2,1) both; }
  .cu-count { display: block; min-height: 18px; color: var(--muted); font-size: 14px; }
  .cu-text { display: block; margin-top: 6px; font: 400 clamp(21px, 3vw, 32px)/1.25 var(--font-display); color: var(--cream);
    text-shadow: 0 2px 12px rgba(0,0,0,.7); }
  @keyframes cap-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @media (max-width: 640px) {
    .cu-title { top: 76px; padding: 0 16px; font-size: 28px; }
  }

  
/* ---------- книга рецептов ---------- */
  dialog.book { width: 100%; height: 100%; max-width: none; max-height: none; margin: 0; padding: 0; border: 0; background: none; color: #2a1a10; }
  dialog.book[open] { display: grid; place-items: center; animation: book-in .5s cubic-bezier(.2,.8,.2,1); }
  dialog.book::backdrop { background: rgba(6,2,3,.8); }
  .book-wrap { position: relative; width: min(1080px, 94vw); }
  .book-stage { position: relative; aspect-ratio: 1.45; max-height: 80svh; margin: 0 auto; perspective: 2600px;
    border: 14px solid #3a1a12; border-radius: 10px; background: #3a1a12;
    box-shadow: 0 30px 80px rgba(0,0,0,.6), inset 0 0 0 2px #6a3a22; }
  .page, .leaf .face { position: absolute; top: 0; bottom: 0; width: 50%; overflow: hidden; }
  .page.left, .leaf .face.l { left: 0; border-radius: 4px 0 0 4px;
    background: linear-gradient(90deg, #e6d4b0, #f6ecd4 14%, #f3e6c8 86%, #d4be94); }
  .page.right, .leaf .face.r { left: 50%; border-radius: 0 4px 4px 0;
    background: linear-gradient(90deg, #d4be94, #f3e6c8 14%, #f6ecd4 86%, #e6d4b0); }
  .leaf { position: absolute; inset: 0; transform-style: preserve-3d; pointer-events: none; z-index: 2; }
  .leaf .face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .leaf.fwd { transform-origin: 50% 50%; }
  .leaf .face.r { transform-origin: 0 50%; }
  .leaf .face.l { transform-origin: 100% 50%; }
  .leaf .shade { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.25), transparent 40%); opacity: 0; transition: opacity .9s; }
  .pg { height: 100%; overflow: auto; padding: clamp(18px, 3.4vw, 36px) clamp(18px, 3.4vw, 40px) 46px; font-family: var(--font-text); }
  .pg h2 { margin: 0 0 6px; font: 400 clamp(28px, 3.6vw, 42px)/1.05 var(--font-display); color: #3a1a10; }
  .pg h3 { margin: 16px 0 6px; font: 400 clamp(18px, 2vw, 22px)/1.2 var(--font-display); color: #7a3a1a; }
  .pg p { margin: 0; font-size: clamp(13.5px, 1.35vw, 15.5px); line-height: 1.6; color: #2a1a10; }
  .pg .tag { font-style: italic; color: #6a4a32; }
  .pg dl { margin: 12px 0 0; font-size: 14px; border-top: 1px dotted #a08a64; }
  .pg dl div { display: flex; justify-content: space-between; gap: 10px; padding: 5px 0; border-bottom: 1px dotted #a08a64; }
  .pg dt { color: #6a4a32; } .pg dd { margin: 0; text-align: right; }
  .pg ul { margin: 6px 0 0; padding-left: 18px; font-size: clamp(13.5px, 1.35vw, 15.5px); line-height: 1.6; }
  .pg li b { color: #7a3a1a; }
  .pg-glass { width: clamp(130px, 15vw, 170px); aspect-ratio: 1; margin: 12px auto 6px; border-radius: 50%; display: grid; place-items: center;
    background: radial-gradient(circle, #3a1a14, #1a0a0c 70%); box-shadow: 0 0 0 3px #c9a46a, 0 0 0 7px #3a1a12; }
  .pg-glass svg { height: 82%; width: auto; }
  .pg-num { position: absolute; bottom: 14px; font-size: 13px; color: #8a6a4a; }
  .page.left .pg-num, .leaf .face.l .pg-num { left: 26px; }
  .page.right .pg-num, .leaf .face.r .pg-num { right: 26px; }
  .pg-title { display: grid; place-content: center; text-align: center; height: 100%; gap: 10px; }
  .pg-title .big { font: 400 clamp(46px, 6vw, 72px)/1 var(--font-display); color: #6b0f22; letter-spacing: .06em; }
  .pg-title .orn { width: 160px; margin: 0 auto; }
  .toc { list-style: none; padding: 0; margin: 8px 0 0; }
  .toc li { display: flex; align-items: baseline; gap: 6px; margin: 2px 0; }
  .toc button { appearance: none; border: 0; background: none; padding: 2px 0; font: inherit; color: #2a1a10; cursor: pointer; text-align: left; }
  .toc button:hover { color: #6b0f22; text-decoration: underline; }
  .toc .dots { flex: 1; border-bottom: 1px dotted #a08a64; transform: translateY(-4px); }
  .toc-h { margin: 12px 0 2px; font: 400 18px/1.2 var(--font-display); color: #7a3a1a; }
  .pg .cook { margin-top: 18px; appearance: none; border: 1px solid #6b0f22; background: #6b0f22; color: #f6ecd4; font: 400 17px/1 var(--font-display);
    padding: 11px 18px; border-radius: 999px; cursor: pointer; }
  .pg .cook:hover { background: #8a1428; }
  .pg button:focus-visible { outline: 2px solid #6b0f22; outline-offset: 2px; }
  .book-wrap .book-close { position: absolute; top: -14px; right: -14px; z-index: 5; }
  .book-nav { display: flex; align-items: center; justify-content: center; gap: 18px; margin-top: 14px; color: var(--muted); font-size: 15px; }
  .book-arrow { width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(214,170,92,.55); background: rgba(14,5,8,.72);
    color: var(--cream); font-size: 28px; line-height: 1; cursor: pointer; }
  .book-arrow:hover { border-color: var(--brass); color: var(--brass); }
  .book-arrow:disabled { opacity: .3; cursor: default; }
  .book-arrow:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  @keyframes book-in { from { opacity: 0; transform: translateY(30px) scale(.96); } to { opacity: 1; transform: none; } }
  @media (max-width: 759px) {
    .book-stage { aspect-ratio: .64; max-height: 74svh; width: 100%; }
    .page.left, .leaf .face.l { display: none; }
    .page.right, .leaf .face.r { left: 0; width: 100%; border-radius: 4px; background: linear-gradient(90deg, #d4be94, #f3e6c8 8%, #f6ecd4 92%, #e6d4b0); }
    .book-wrap .book-close { top: -54px; right: 0; }
  }

  
/* ---------- карточка ---------- */
  dialog.card { margin: 0 0 0 auto; padding: 0; border: 0; border-left: 1px solid rgba(214,170,92,.35);
    width: min(480px, 100%); max-width: 100%; height: 100%; max-height: 100%; overflow: auto;
    background: linear-gradient(180deg, #2a1118, #1a0a0e); color: var(--cream);
    box-shadow: -20px 0 50px rgba(0,0,0,.5); }
  dialog.card[open] { animation: slide-in .35s cubic-bezier(.2,.8,.2,1); }
  dialog.card::backdrop { background: rgba(8,2,4,.62); }
  .close-wrap { position: sticky; top: 0; height: 0; z-index: 2; text-align: right; padding-right: 12px; }
  .close { position: relative; top: 12px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
    border: 1px solid rgba(214,170,92,.5); background: rgba(20,8,10,.78); color: var(--cream); font-size: 22px; line-height: 1; }
  .close:hover { border-color: var(--brass); color: var(--brass); }
  .close:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .card-inner { padding: 28px 28px calc(40px + env(safe-area-inset-bottom, 0px)); }
  .card-inner > * { animation: reveal .55s cubic-bezier(.2,.8,.2,1) both; }
  .stage { display: grid; place-items: center; height: 210px; margin: 8px -8px 0;
    background: radial-gradient(closest-side, rgba(255,184,96,.28), transparent 75%); }
  .stage svg { height: 190px; width: auto; }
  .pour { animation: pour-up 1.2s .5s cubic-bezier(.3,.7,.2,1) both; }
  .late { animation: fade-in-late .6s 1.5s both; }
  .title { margin: 8px 0 4px; font: 400 44px/1.1 var(--font-display); }
  .tagline { margin: 0; color: var(--muted); font-size: 17px; line-height: 1.5; }
  .facts { margin: 22px 0 4px; border-top: 1px solid rgba(214,170,92,.3); }
  .facts div { display: flex; justify-content: space-between; gap: 16px; padding: 10px 0; border-bottom: 1px solid rgba(214,170,92,.2); }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; text-align: right; }
  .card h3 { margin: 26px 0 8px; font: 400 22px/1.2 var(--font-display); color: var(--brass); }
  .card p { margin: 0; max-width: 60ch; font-size: 16px; line-height: 1.65; }
  .card ul { margin: 0; padding-left: 20px; line-height: 1.6; }
  .card li { margin: 6px 0; }
  .card b { font-weight: 600; }

  @media (max-width: 640px) {
    dialog.card { margin: auto 0 0 0; width: 100%; height: auto; max-height: 88svh;
      border-left: 0; border-top: 1px solid rgba(214,170,92,.35); border-radius: 18px 18px 0 0; }
    dialog.card[open] { animation-name: slide-up; }
    .card-inner { padding: 24px 22px calc(36px + env(safe-area-inset-bottom, 0px)); }
    .title { font-size: 38px; }
    .go { font-size: 15px; padding: 10px 14px 10px 10px; }
    .go-right { padding: 10px 10px 10px 14px; }
    .prop.glasses { display: none; }
    .music { padding: 8px; }
    .patron { display: none; }
    dialog.mix { inset: auto 0 0 0; width: 100%; height: auto; max-height: 72svh; border-left: 0;
      border-top: 1px solid rgba(214,170,92,.35); border-radius: 18px 18px 0 0; }
    dialog.mix[open] { animation-name: slide-up; }
    .mix-inner { padding: 18px 18px calc(32px + env(safe-area-inset-bottom, 0px)); }
    .mix-go { margin: 10px -18px -32px; padding: 14px 18px calc(14px + env(safe-area-inset-bottom, 0px)); }
    .mix-top h2 { font-size: 28px; }
    .prop.limes { left: 4%; }
    .prop.bucket { left: 76%; }
    .music .label { display: none; }
  }

  /* ---------- движение ---------- */
  @keyframes blackout { 0%, 25% { opacity: .95; } 45% { opacity: .8; } 65% { opacity: .55; } 85% { opacity: .3; } 100% { opacity: 0; } }
  @keyframes flicker { 0% { opacity: 0; } 8% { opacity: .9; } 14% { opacity: .15; } 24% { opacity: .8; } 30% { opacity: .3; } 44% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes led-on { from { filter: brightness(.25); } to { filter: brightness(1); } }
  @keyframes fade-in { to { opacity: 1; } }
  @keyframes scene-in { from { transform: scale(1.14); } to { transform: none; } }
  @keyframes door-l { to { transform: rotateY(105deg); visibility: hidden; } }
  @keyframes door-r { to { transform: rotateY(-105deg); visibility: hidden; } }
  @keyframes slide-in { from { transform: translateX(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes slide-up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes reveal { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @keyframes pour-up { from { transform: translateY(120px); } to { transform: none; } }
  @keyframes fade-in-late { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pa-turn { 0%, 55%, 100% { transform: rotate(0); } 62%, 84% { transform: rotate(6deg); } }
  @keyframes pb-drink { 0%, 62%, 100% { transform: rotate(150deg); } 72%, 86% { transform: rotate(0deg); } }
  @keyframes pb-tilt { 0%, 70%, 100% { transform: none; } 76%, 84% { transform: translateY(-2px) rotate(-3deg); } }
  @keyframes neon-blink { 0% { opacity: 1; } 10% { opacity: .35; } 18% { opacity: 1; } 30% { opacity: .5; } 36% { opacity: 1; } 100% { opacity: 1; } }
  @keyframes shake { 0%, 100% { transform: translateY(0) rotate(0); } 25% { transform: translateY(-8px) rotate(-6deg); }
    50% { transform: translateY(4px) rotate(5deg); } 75% { transform: translateY(-6px) rotate(-4deg); } }
  @keyframes flame { 0%, 100% { transform: scale(1, 1) skewX(0); } 25% { transform: scale(.96, 1.07) skewX(-2.5deg); }
    55% { transform: scale(1.03, .95) skewX(2deg); } 80% { transform: scale(.98, 1.05) skewX(-1deg); } }
  @keyframes glow-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .85; } }
  @keyframes wisp { 0% { opacity: .7; transform: translateY(0) scaleX(.8); } 100% { opacity: 0; transform: translateY(-90px) scaleX(1.8); } }
  @keyframes smoke { 0% { opacity: 0; transform: translateY(8px) scale(.7, .8); } 15% { opacity: .55; }
    100% { opacity: 0; transform: translateY(-40px) scale(1.5, 1.2); } }

  @media (prefers-reduced-motion: reduce) {
    .blackout, .doors { display: none; }
    .room-bar .scene, .shelving { animation: none; }
    .neon-text, .hint, .go { opacity: 1; animation: none; }
    .world { transition: none; }
    .flame, .nook-glow, .smoke-wisp, .wisp { animation: none; }
    .smoke-wisp { opacity: .35; }
    .nook-dark { transition: none; }
    .card-inner > *, .pour, .late { animation: none; }
    dialog.card[open] { animation: none; }
    .bottle svg { transition: none; }
    .pa-head, .pb-arm, .pb-head, .neon.blink { animation: none; }
    .dust { display: none; }
    .nk-rain, .nk-drop, .nk-win, .nk-ladder, .nk-reach, .nk-pen, .nk-head, .nk-lamplight, .moth-fly, .moth .wing { animation: none !important; }
    .room-nook.flash .nk-flash, .room-nook.flash .nk-winflash { animation: none !important; }
    dialog.book[open] { animation: none; }
    .sm-fl, .sm-glow, .sm-sconce, .sm-ember, .sm-pend, .sm-cat-body, .sm-tail, .sm-ear, .pp-paper, .pp-shin, .pp-puff circle,
    .pp-ember, .sm-haze, body.music-on .sm-disc, body.music-on .sm-note, .sm-sec, .sm-eyes .eye { animation: none !important; }
    dialog.mix[open] { animation: none; }
    .music { opacity: 1; animation: none; }
    .music.on .disc { animation: none; }
  }

  /* ---------- кнопки справа: плеер, журнал, настройки ---------- */
  .tools { position: absolute; top: 76px; right: 18px; z-index: 4; display: grid; gap: 8px; }
  .tool { position: relative; appearance: none; width: 46px; height: 46px; display: grid; place-items: center; padding: 0; border-radius: 50%;
    border: 1px solid rgba(214,170,92,.35); background: rgba(20,8,11,.72); color: var(--cream); cursor: pointer;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: border-color .2s, color .2s, transform .2s; }
  .tool svg { width: 22px; height: 22px; }
  .tool:hover { border-color: var(--brass); color: var(--brass); }
  .tool:active { transform: scale(.94); }
  .tool:focus-visible { outline: 2px solid var(--brass); outline-offset: 3px; }
  .tool-dot { position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: #ffd27a; box-shadow: 0 0 8px #ffb04a; }
  .app.seated .tools, .app.mixing .tools { opacity: .0; visibility: hidden; }

  /* ---------- панели: настройки, журнал, плеер, рассказы ---------- */
  dialog.sheet { position: fixed; inset: 0 0 0 auto; z-index: 9; margin: 0; padding: 0; border: 0; width: min(440px, 100%); height: 100%; max-height: 100%;
    overflow: auto; border-left: 1px solid rgba(214,170,92,.35); color: var(--cream);
    background: linear-gradient(180deg, rgba(38,12,19,.98), rgba(20,8,11,.99)); box-shadow: -20px 0 50px rgba(0,0,0,.5); }
  dialog.sheet[open] { animation: slide-in .35s cubic-bezier(.2,.8,.2,1); }
  dialog.sheet::backdrop { background: rgba(5,1,2,.35); }
  dialog.sheet.wide { width: min(560px, 100%); }
  .sheet-in { padding: 22px 24px calc(36px + env(safe-area-inset-bottom, 0px)); }
  .sheet-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .sheet-top h2 { margin: 0; font: 400 32px/1.1 var(--font-display); }
  .sheet-top .close { position: static; }
  .sheet h3 { margin: 26px 0 10px; font: 400 20px/1.2 var(--font-display); color: var(--brass); }
  .sheet p.note { margin: 8px 0 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid rgba(214,170,92,.12); }
  .row label, .row .lbl { font-size: 15px; line-height: 1.35; }
  .row small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
  .row.slider { grid-template-columns: 120px 1fr 44px; }
  .row.slider output { text-align: right; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
  input[type=range].rng { -webkit-appearance: none; appearance: none; width: 100%; height: 28px; background: none; cursor: pointer; }
  input[type=range].rng::-webkit-slider-runnable-track { height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--brass) var(--v, 50%), rgba(214,170,92,.22) var(--v, 50%)); }
  input[type=range].rng::-moz-range-track { height: 4px; border-radius: 4px; background: rgba(214,170,92,.22); }
  input[type=range].rng::-moz-range-progress { height: 4px; border-radius: 4px; background: var(--brass); }
  input[type=range].rng::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7px; border-radius: 50%; background: #f1d7a6; border: 2px solid #8a6328; box-shadow: 0 0 10px rgba(255,190,100,.35); }
  input[type=range].rng::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: #f1d7a6; border: 2px solid #8a6328; }
  input[type=range].rng:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; border-radius: 6px; }
  .sw { position: relative; width: 46px; height: 26px; flex: none; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .sw span { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.08); border: 1px solid rgba(214,170,92,.4); transition: background .2s; pointer-events: none; }
  .sw span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #cdb894; transition: transform .2s, background .2s; }
  .sw input:checked + span { background: rgba(214,170,92,.45); }
  .sw input:checked + span::after { transform: translateX(20px); background: #ffe2a8; }
  .sw input:focus-visible + span { outline: 2px solid var(--brass); outline-offset: 2px; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg .chip { padding: 8px 11px; font-size: 14px; }
  .sheet .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
  .make.warn { border-color: #d07a6a; color: #ffd8d0; background: rgba(160,40,30,.2); }

  /* уведомления */
  .toasts { position: fixed; z-index: 20; right: 78px; top: 76px; display: grid; gap: 8px; width: min(340px, calc(100% - 32px)); pointer-events: none; }
  .toast { pointer-events: auto; display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 12px; cursor: pointer;
    background: rgba(26,9,13,.94); border: 1px solid rgba(214,170,92,.45); box-shadow: 0 10px 30px rgba(0,0,0,.45), 0 0 24px rgba(255,160,70,.12);
    color: var(--cream); animation: toast-in .45s cubic-bezier(.2,.8,.2,1); }
  .toast.out { opacity: 0; transform: translateY(8px); transition: opacity .35s, transform .35s; }
  .toast .t-ic { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%; background: rgba(214,170,92,.18); color: #ffd890; font-size: 15px; }
  .toast.secret .t-ic { background: rgba(140,60,200,.22); color: #e6c8ff; }
  .toast b { display: block; font: 400 17px/1.2 var(--font-display); color: #ffe0b0; }
  .toast .t-tx span { display: block; margin-top: 2px; font-size: 13.5px; color: var(--muted); }
  @keyframes toast-in { from { opacity: 0; transform: translateY(14px) scale(.98); } to { opacity: 1; transform: none; } }

  /* плеер */
  .np { margin-top: 18px; padding: 16px; border-radius: 14px; background: linear-gradient(140deg, rgba(214,170,92,.14), rgba(120,20,30,.16)); border: 1px solid rgba(214,170,92,.3); }
  .np-title { margin: 0; font: 400 24px/1.15 var(--font-display); }
  .np-artist { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
  .np-viz { display: block; width: 100%; height: 54px; margin-top: 12px; }
  .np-bar { position: relative; height: 4px; margin-top: 10px; border-radius: 4px; background: rgba(214,170,92,.2); overflow: hidden; }
  .np-bar i { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--brass); }
  .np-time { display: flex; justify-content: space-between; margin-top: 6px; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .np-ctl { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 10px; }
  .pbtn { appearance: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; border: 1px solid rgba(214,170,92,.45); background: rgba(255,255,255,.04); color: var(--cream); cursor: pointer; }
  .pbtn svg { width: 20px; height: 20px; }
  .pbtn.big { width: 60px; height: 60px; background: rgba(214,170,92,.28); border-color: var(--brass); }
  .pbtn.big svg { width: 24px; height: 24px; }
  .pbtn:hover { border-color: var(--brass); background: rgba(214,170,92,.2); }
  .pbtn:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .tracks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  .trk { display: grid; grid-template-columns: 34px 1fr auto auto; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(255,255,255,.035); }
  .trk.cur { background: rgba(214,170,92,.16); box-shadow: inset 0 0 0 1px rgba(214,170,92,.45); }
  .trk b { display: block; font: 400 17px/1.2 var(--font-display); }
  .trk span { display: block; margin-top: 2px; color: var(--muted); font-size: 12.5px; }
  .trk .pbtn { width: 34px; height: 34px; }
  .trk .pbtn svg { width: 14px; height: 14px; }
  .trk time { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }

  /* журнал */
  .jtabs { margin-top: 16px; }
  .jlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .jitem { display: grid; grid-template-columns: 38px 1fr; gap: 12px; align-items: start; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.035); }
  .jitem .ji { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: rgba(214,170,92,.18); color: #ffd890; font-size: 17px; }
  .jitem.locked { opacity: .55; }
  .jitem.locked .ji { background: rgba(255,255,255,.06); color: var(--muted); }
  .jitem b { display: block; font: 400 18px/1.2 var(--font-display); }
  .jitem span { display: block; margin-top: 3px; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
  .jitem em { display: block; margin-top: 4px; color: rgba(214,170,92,.8); font-size: 12px; font-style: normal; }
  .jmeter { display: flex; align-items: center; gap: 10px; margin: 12px 0 4px; color: var(--muted); font-size: 14px; }
  .jmeter .np-bar { flex: 1; margin: 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .stat { padding: 12px; border-radius: 12px; background: rgba(255,255,255,.04); }
  .stat b { display: block; font: 400 28px/1 var(--font-display); color: #ffe0b0; }
  .stat span { display: block; margin-top: 5px; color: var(--muted); font-size: 13px; }

  /* рассказы читальни */
  .story-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .story-list button { appearance: none; width: 100%; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(214,170,92,.25); background: rgba(255,255,255,.035); color: var(--cream); cursor: pointer; font: inherit; }
  .story-list button:hover { border-color: var(--brass); }
  .story-list button:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  .story-list b { display: block; font: 400 19px/1.2 var(--font-display); }
  .story-list span { display: block; margin-top: 4px; color: var(--muted); font-size: 13.5px; }
  .story-list .read::after { content: " · прочитано"; color: var(--brass); }
  .story-text p { margin: 0 0 14px; font-size: 16.5px; line-height: 1.7; }
  .story-text h3 { margin-top: 18px; }
  .quote { margin: 16px 0 0; padding: 16px 18px; border-left: 3px solid var(--brass); background: rgba(214,170,92,.08); border-radius: 0 12px 12px 0; }
  .quote p { margin: 0; font: italic 400 19px/1.5 var(--font-display); }
  .quote span { display: block; margin-top: 8px; color: var(--muted); font-size: 13px; }

  /* атмосфера комнаты */
  dialog.atmo { position: fixed; z-index: 9; inset: auto auto calc(92px + env(safe-area-inset-bottom, 0px)) 50%; transform: translateX(-50%); margin: 0; width: min(420px, calc(100% - 24px));
    padding: 16px 18px 18px; border-radius: 16px; border: 1px solid rgba(214,170,92,.4); color: var(--cream);
    background: rgba(24,8,12,.95); box-shadow: 0 16px 40px rgba(0,0,0,.5); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  dialog.atmo[open] { animation: toast-in .3s cubic-bezier(.2,.8,.2,1); }
  dialog.atmo h2 { margin: 0 34px 6px 0; font: 400 22px/1.2 var(--font-display); }
  dialog.atmo .close { position: absolute; top: 10px; right: 10px; }

  @media (max-width: 620px) {
    .tools { top: 72px; right: 14px; gap: 6px; }
    .tool { width: 42px; height: 42px; }
    dialog.sheet, dialog.sheet.wide { inset: auto 0 0 0; width: 100%; height: auto; max-height: 86svh; border-left: 0; border-top: 1px solid rgba(214,170,92,.35); border-radius: 18px 18px 0 0; }
    dialog.sheet[open] { animation-name: slide-up; }
    .sheet-in { padding: 18px 18px calc(28px + env(safe-area-inset-bottom, 0px)); }
    .sheet-top h2 { font-size: 27px; }
    .row.slider { grid-template-columns: 96px 1fr 40px; }
    .toasts { right: auto; left: 50%; top: 118px; transform: translateX(-50%); width: min(340px, calc(100% - 120px)); }
    dialog.atmo { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) {
    dialog.sheet[open], dialog.atmo[open], .toast { animation: none; }
  }

  /* бар с друзьями */
  .tool-count { position: absolute; top: -4px; right: -4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #b3263e; color: #fff; font: 600 11px/18px var(--font-text); font-style: normal; text-align: center; }
  .fr-in { width: 100%; min-width: 0; border: 1px solid rgba(214,170,92,.35); background: rgba(255,255,255,.04); color: var(--cream); font: 400 16px/1.2 var(--font-text); padding: 11px 12px; border-radius: 10px; }
  .fr-in:focus-visible { outline: 2px solid var(--brass); outline-offset: 1px; }
  .fr-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 10px; }
  .fr-link { margin-top: 16px; padding: 14px; border-radius: 12px; background: rgba(214,170,92,.1); border: 1px solid rgba(214,170,92,.3); }
  .fr-link > span { display: block; color: var(--muted); font-size: 13px; }
  .fr-link code { display: block; margin-top: 6px; font: 400 14px/1.4 ui-monospace, Menlo, monospace; color: #ffe0b0; word-break: break-all; }
  .fr-link .acts { margin-top: 10px; }
  .fr-log { max-height: 220px; overflow: auto; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.22); }
  .fr-log p { margin: 0 0 6px; font-size: 14.5px; line-height: 1.45; }
  .fr-log p b { color: #ffd890; font-weight: 600; }
  .fr-log p.me b { color: var(--brass); }
  .nametag { position: absolute; z-index: 5; left: 0; top: 0; padding: 3px 9px; border-radius: 999px; background: rgba(20,8,11,.78); border: 1px solid rgba(214,170,92,.5);
    color: #ffe0b0; font: 400 13px/1.3 var(--font-text); white-space: nowrap; pointer-events: none; transform: translate(-50%, -100%); }
  .fbubble { position: absolute; z-index: 6; left: 0; top: 0; max-width: min(240px, 60vw); padding: 8px 12px; border-radius: 12px; background: #f3e8d2; color: #2a1610;
    font: 400 14px/1.4 var(--font-text); box-shadow: 0 8px 24px rgba(0,0,0,.45); pointer-events: none; opacity: 0; transition: opacity .25s; }
  .fbubble.show { opacity: 1; }
  .app.showing .nametag, .app.showing .fbubble, .app.street .nametag { display: none; }

  /* фото на память */
  .flash { position: fixed; inset: 0; z-index: 30; background: #fff; opacity: 0; pointer-events: none; }
  .flash.go { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }
  .photo-img { display: block; width: 100%; height: auto; margin-top: 14px; border-radius: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.5); }
  @media (prefers-reduced-motion: reduce) { .flash.go { animation: none; } }

  /* неоновый логотип на входе */
  .intro h1.neon-in { animation: none; position: relative; color: transparent; text-shadow: none; }
  .intro h1.neon-in .nl { display: inline-block; color: #3a1c22; text-shadow: 0 0 2px rgba(255,80,110,.2); animation: nl-on 1.1s steps(1, end) both; }
  @keyframes nl-on {
    0% { color: #3a1c22; text-shadow: 0 0 2px rgba(255,80,110,.2); }
    12% { color: #ffe9ee; text-shadow: 0 0 6px #fff, 0 0 18px #ff4d6d, 0 0 44px #ff2450; }
    20% { color: #3a1c22; text-shadow: 0 0 2px rgba(255,80,110,.2); }
    34% { color: #ffe9ee; text-shadow: 0 0 6px #fff, 0 0 18px #ff4d6d, 0 0 44px #ff2450; }
    40% { color: #5a2a32; text-shadow: 0 0 4px rgba(255,80,110,.4); }
    55%, 100% { color: #ffe9ee; text-shadow: 0 0 6px #fff, 0 0 18px #ff4d6d, 0 0 44px #ff2450, 0 0 90px #ff2450; }
  }
  .nl-sweep { position: absolute; inset: -10% -20%; pointer-events: none; background: linear-gradient(105deg, transparent 40%, rgba(255,230,210,.22) 50%, transparent 60%);

<script>
  /* общие связки между 3D-сценой и модулями основной версии */
  let busy = false, cur = 1;
  const app = document.getElementById("app");
  const H3D = {};
  function setRoom(i) { if (H3D.go) H3D.go(i); }
  const Bartender = {
    setActive() {}, release() {}, serve() { return 0; }, glassX() { return 0; },
    prep() { if (H3D.prep) H3D.prep(); }, done() { if (H3D.done) H3D.done(); }
  };
  const Ambience = { setActive(on) { if (H3D.pause) H3D.pause(!on); } };
  function noGL() {
    if (H3D.ready) return;
    document.getElementById("intro-text").textContent = "Бар не открылся: этот браузер не поддерживает 3D-графику (WebGL) или страница не загрузилась. Попробуй обновить страницу или открыть сайт в Chrome, Safari или Firefox.";
    document.getElementById("enter").hidden = true;
    document.querySelector(".load").hidden = true;
  }
  setTimeout(noGL, 25000);
/* ================= настройки гостя, звуковые каналы, уведомления, прогресс =================
   Всё хранится только в этом браузере (localStorage), без регистрации и без сервера. */
  const SET_DEFAULT = { master: .8, music: .7, ambient: .6, ui: .45, mute: false, quality: "auto", fps: "60", effects: true, motion: "auto", saver: false, mood: "auto" };
  const SET = Object.assign({}, SET_DEFAULT, (() => { try { return JSON.parse(localStorage.getItem("hacheden-settings")) || {}; } catch (e) { return {}; } })());
  const SET_LISTEN = [];
  function saveSettings() { try { localStorage.setItem("hacheden-settings", JSON.stringify(SET)); } catch (e) {} }
  function setSetting(k, v) { SET[k] = v; saveSettings(); SET_LISTEN.forEach(f => { try { f(k, v); } catch (e) { console.warn(e); } }); }
  const onSetting = f => SET_LISTEN.push(f);
  /* «меньше движения»: по системе или вручную */
  const reduceMotionMQ = matchMedia("(prefers-reduced-motion: reduce)");
  const reduceMotion = { get matches() { return SET.motion === "reduce" || (SET.motion === "auto" && reduceMotionMQ.matches); } };

  /* каналы звука: музыка, окружение (дождь, камин, звуки бара), интерфейс */
  const AUDIO = {
    routes: [],
    level(ch) { return SET.mute ? 0 : SET.master * (ch === "music" ? SET.music : ch === "ambient" ? SET.ambient : SET.ui); },
    // любой звуковой контекст подключаем через свой регулятор громкости
    route(ctx, ch) {
      if (!ctx || ctx._hRoute) return ctx;
      const real = ctx.destination, g = ctx.createGain();
      g.gain.value = AUDIO.level(ch);
      g.connect(real);
      try { Object.defineProperty(ctx, "destination", { value: g, configurable: true }); } catch (e) { return ctx; }
      ctx._hRoute = true;
      AUDIO.routes.push([ctx, g, ch]);
      return ctx;
    },
    apply() {
      for (const [ctx, g, ch] of AUDIO.routes) g.gain.setTargetAtTime(AUDIO.level(ch), ctx.currentTime, .12);
      if (typeof Music !== "undefined") Music.levels();
    }
  };
  onSetting(k => { if (["master", "music", "ambient", "ui", "mute"].includes(k)) AUDIO.apply(); });

  /* звуки интерфейса: тихий щелчок кнопки, мягкий звонок для находок */
  let uiCtx = null;
  function uiAudio() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    if (!uiCtx) { try { uiCtx = AUDIO.route(new AC(), "ui"); } catch (e) { return null; } }
    if (uiCtx.state === "suspended") uiCtx.resume();
    return uiCtx;
  }
  function uiSound(kind = "tick") {
    if (AUDIO.level("ui") <= .001) return;
    const c = uiAudio(); if (!c) return;
    const t = c.currentTime + .01;
    const tone = (f, at, dur, v, type = "sine") => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t + at);
      g.gain.setValueAtTime(0, t + at); g.gain.linearRampToValueAtTime(v, t + at + .006); g.gain.exponentialRampToValueAtTime(.0001, t + at + dur);
      o.connect(g).connect(c.destination); o.start(t + at); o.stop(t + at + dur + .02);
    };
    if (kind === "tick") tone(2100, 0, .045, .035, "triangle");
    else if (kind === "soft") tone(1300, 0, .07, .03);
    else if (kind === "open") { tone(660, 0, .16, .03); tone(990, .05, .2, .022); }
    else if (kind === "chime") { tone(1318.5, 0, .9, .045); tone(1760, .11, 1.1, .04); tone(2637, .22, .9, .015); }
  }
  document.addEventListener("pointerdown", e => {
    const b = e.target.closest && e.target.closest("button, [role=tab], select, summary");
    if (b && !b.disabled) uiSound(b.classList.contains("make") || b.classList.contains("enter") ? "soft" : "tick");
  }, true);

  /* аккуратные уведомления в углу: секреты, достижения, сохранения */
  let toastBox = null;
  function toast(title, text = "", kind = "") {
    if (!toastBox) {
      toastBox = document.createElement("div");
      toastBox.className = "toasts"; toastBox.setAttribute("role", "status"); toastBox.setAttribute("aria-live", "polite");
      document.body.appendChild(toastBox);
    }
    const el = document.createElement("div");
    el.className = "toast" + (kind ? " " + kind : "");
    const icon = kind === "secret" ? "✦" : kind === "ach" ? "★" : "•";
    el.innerHTML = `<span class="t-ic" aria-hidden="true">${icon}</span><span class="t-tx"><b></b><span></span></span>`;
    el.querySelector("b").textContent = title;
    el.querySelector(".t-tx span").textContent = text;
    toastBox.appendChild(el);
    while (toastBox.children.length > 3) toastBox.firstChild.remove();
    const bye = () => { el.classList.add("out"); setTimeout(() => el.remove(), 400); };
    el.addEventListener("click", bye);
    setTimeout(bye, kind ? 6000 : 4200);
  }

  /* прогресс гостя: где был, что пил, что нашёл */
  const PROG = Object.assign({ rooms: [], secrets: {}, ach: {}, drinks: {}, tracks: [], favTracks: [], stories: [], visits: 0, first: 0, counters: {} },
    (() => { try { return JSON.parse(localStorage.getItem("hacheden-progress")) || {}; } catch (e) { return {}; } })());
  function saveProgress() { try { localStorage.setItem("hacheden-progress", JSON.stringify(PROG)); } catch (e) {} }
  const PROG_LISTEN = [];
  /* событие: track("room", 2), track("drink", "c-mojito"), track("secret", "cellar") … */
  function track(ev, v) {
    let changed = false;
    const addTo = (arr, x) => { if (!arr.includes(x)) { arr.push(x); changed = true; } };
    if (ev === "room") addTo(PROG.rooms, v);
    else if (ev === "drink") { PROG.drinks[v] = (PROG.drinks[v] || 0) + 1; changed = true; }
    else if (ev === "track") addTo(PROG.tracks, v);
    else if (ev === "story") addTo(PROG.stories, v);
    else if (ev === "count") { PROG.counters[v] = (PROG.counters[v] || 0) + 1; changed = true; }
    else if (ev === "secret") {
      if (!PROG.secrets[v]) {
        PROG.secrets[v] = Date.now(); changed = true;
        const s = typeof SECRET_INFO !== "undefined" && SECRET_INFO[v];
        setTimeout(() => { uiSound("chime"); toast("Найден секрет", s ? s.name : "", "secret"); }, 400);
      }
    }
    if (!changed) return;
    saveProgress();
    PROG_LISTEN.forEach(f => { try { f(ev, v); } catch (e) { console.warn(e); } });
  }
  const onProgress = f => PROG_LISTEN.push(f);
  if (!PROG.first) PROG.first = Date.now();
  PROG.visits++;
  saveProgress();

/* ---------- формы бутылок ---------- */

    tall:     { d: "M24 22H36V60C36 68 50 70 50 84V186Q50 194 42 194H18Q10 194 10 186V84C10 70 24 68 24 60Z", neck: [24, 36], top: 22, body: [10, 40] },
    flask:    { d: "M23 18H37V44C37 52 54 54 54 70V186Q54 194 46 194H14Q6 194 6 186V70C6 54 23 52 23 44Z", neck: [23, 37], top: 18, body: [6, 48] },
    square:   { d: "M24 20H36V52L50 62V186Q50 194 42 194H18Q10 194 10 186V62L24 52Z", neck: [24, 36], top: 20, body: [10, 40] },

      to(cube, { x: tx, r: cube.r + rnd(60, 140) }, d, EZ.lin);

    /* ---------- фон: расфокусированный бар и люди за спиной ---------- */

        gr.addColorStop(0, `rgba(${c},${a.toFixed(3)})`); gr.addColorStop(.6, `rgba(${c},${(a * .55).toFixed(3)})`); gr.addColorStop(1, `rgba(${c},0)`);
        g.fillStyle = gr; g.fillRect(0, 0, sp.width, sp.height);

      });

      mg.beginPath(); mg.arc(110, 80, 28, 0, 6.283); mg.fill();

      band.addColorStop(0, "rgba(120,10,30,0)"); band.addColorStop(.45, "rgba(200,30,60,.32)"); band.addColorStop(1, "rgba(80,8,20,0)");
      s.fillStyle = band; s.fillRect(0, 0, BK.W, BK.H);

      for (let row = 0; row < 2; row++) {
        const by = BK.H * (.32 + row * .17);
        for (let x = 10; x < BK.W; x += rnd(30, 60) * k + 8) {
          const h = rnd(50, 110) * k, w = rnd(14, 28) * k;
          s.fillStyle = `rgba(${Math.round(rnd(20, 70))},${Math.round(rnd(5, 20))},${Math.round(rnd(10, 25))},.9)`;

  const ABV = { rum: 40, tequila: 38, gin: 40, whisky: 40, cognac: 40, wine: 13, triple: 40, cherry: 24, campari: 25, vermouthR: 16, vermouthD: 17, bitters: 44.7 };
  function drinkStats(c) {
    const prog = Closeup.PROGRAMS[c.id] || [];
    let ml = 0, alc = 0, tops = 0;
    const add = (ing, v) => { ml += v; alc += v * (ABV[ing] || 0) / 100; };
    prog.forEach(st => {
      if (st[0] === "jig" || st[0] === "pour") add(st[1], st[2]);
      else if (st[0] === "dash") add("bitters", st[2] * .8);
      else if (st[0] === "hot") add("water", st[1]);
      else if (st[0] === "float") add("grenadine", 15);
      else if (st[0] === "squeeze") add("lime", 10);
      else if (st[0] === "top") tops++;
    });
    const iced = prog.some(s => s[0] === "ice");
    const dil = c.method === "shake" ? .25 : c.method === "stir" ? .2 : c.method === "fire" ? 0 : iced ? .1 : 0;
    let vol = ml * (1 + dil);
    if (tops) vol = Math.max(vol + 40 * tops, Closeup.CAP_ML[c.cup] || 165);
    vol = Math.max(vol, 1);
    return { ml: Math.round(vol / 5) * 5, abv: alc / vol * 100 };
  }
  const abvText = a => a < .5 ? "без алкоголя" : `≈ ${Math.round(a)}%`;
  const statText = s => `≈ ${s.ml} мл · ${abvText(s.abv)}`;
  const METHOD_SHORT = { shake: "шейкер", stir: "размешать", build: "в бокале", fire: "огонь" };
  function finishDrink(c) {
    c.stats = drinkStats(c);
    c.glassLabel = escH(`${c.name}: ${GLASS_NAME[c.cup]}`);
    c.facts = [["Родина", c.origin], ["Бокал", GLASS_NAME[c.cup]], ["Как делают", METHOD[c.method]], ["Объём и крепость", statText(c.stats)]];
  }
  COCKTAILS.forEach(finishDrink);
  SECRETS.forEach(finishDrink);
  const COCKTAIL_BY_ID = Object.fromEntries(COCKTAILS.map(c => [c.id, c]));

  /* ---------- память гостя: избранное, найденные тайны, свои рецепты ---------- */
  const keepGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const keepSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const FAV = new Set(keepGet("hacheden-fav", []));
  const FOUND = new Set(keepGet("hacheden-found", []));
  function addDrink(c) {
    if (!COCKTAILS.includes(c)) COCKTAILS.push(c);
    COCKTAIL_BY_ID[c.id] = c;
    if (typeof Book !== "undefined" && Book.reset) Book.reset();
  }
  function revealSecret(c) {
    const fresh = !FOUND.has(c.id);
    FOUND.add(c.id);
    keepSet("hacheden-found", [...FOUND]);
    addDrink(c);
    if (fresh) track("count", "recipe");
    return fresh;
  }
  SECRETS.forEach(s => { if (FOUND.has(s.id)) addDrink(s); });

  /* ---------- конструктор: бармен собирает рецепт из того, что выбрал гость ---------- */
  const ROLE = { rum: "spirit", tequila: "spirit", gin: "spirit", whisky: "spirit", cognac: "spirit", wine: "wine",
    triple: "liq", cherry: "liq", campari: "bitter", vermouthR: "verm", vermouthD: "verm", bitters: "dash",
    tonic: "top", soda: "top", cola: "top", oj: "juice", pineapple: "juice", coconut: "cream",
    lime: "sour", lemon: "sour", mint: "mint", syrup: "sweet", grenadine: "sweet", coffee: "top", tea: "top", cream: "cream" };
  // сначала недорогое, крепкое в самом конце: если ошибёшься, выльешь меньше
  const ROLE_ORDER = ["sour", "sweet", "juice", "cream", "liq", "bitter", "verm", "wine", "spirit"];
  const ICE_NAME = { none: "без льда", cubes: "лёд кубиками", crushed: "колотый лёд" };
  const CUP_SHORT = { highball: "высокий", rocks: "рокс", coupe: "блюдце", martini: "коктейльный", wine: "винный" };
  const LIQ = Object.fromEntries(Object.keys(ROLE).map(k => [k, (Closeup.LOOK[k] || {}).liq || "#f2f0e8"]));
  const round5 = v => Math.max(5, Math.round(v / 5) * 5);
  function hashStr(s) { let h = 2166136261; for (const ch of s) { h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }

  function blend(parts) {
    let r = 0, g = 0, b = 0, w = 0;
    parts.forEach(([hex, ml]) => {
      const n = parseInt(hex.slice(1), 16), c = [n >> 16 & 255, n >> 8 & 255, n & 255];
      const lum = (.2126 * c[0] + .7152 * c[1] + .0722 * c[2]) / 255, k = ml * (.35 + 2.2 * (1 - lum));
      r += c[0] * k; g += c[1] * k; b += c[2] * k; w += k;
    });
    if (!w) return { hex: "#f2efe4", lum: .9, h: 0, s: 0 };
    const c = [r / w, g / w, b / w].map(v => Math.round(v));
    const mx = Math.max(...c), mn = Math.min(...c), d = mx - mn;
    let h = 0;
    if (d) h = mx === c[0] ? ((c[1] - c[2]) / d + 6) % 6 : mx === c[1] ? (c[2] - c[0]) / d + 2 : (c[0] - c[1]) / d + 4;
    return { hex: "#" + c.map(v => v.toString(16).padStart(2, "0")).join(""), lum: (.2126 * c[0] + .7152 * c[1] + .0722 * c[2]) / 255, h: h * 60, s: mx ? d / mx : 0 };
  }
  const NAME_ADJ = { pale: ["Лунный", "Жемчужный", "Туманный"], red: ["Рубиновый", "Багряный", "Алый"], orange: ["Янтарный", "Медный", "Закатный"],
    gold: ["Золотой", "Солнечный", "Медовый"], green: ["Изумрудный", "Мятный", "Весенний"], dark: ["Полночный", "Бархатный", "Тёмный"], cool: ["Сапфировый", "Ночной", "Северный"] };
  const NAME_NOUN = ["шёпот", "блюз", "фокстрот", "пароль", "секрет", "тост", "бриз", "вальс", "гамбит", "этюд", "мотив", "романс", "свинг", "аккорд", "сигнал", "кураж"];
  function colourFamily(col) {
    if (col.lum < .14) return "dark";
    if (col.s < .18 || col.lum > .82) return "pale";
    const h = col.h;
    if (h < 14 || h >= 330) return "red";
    if (h < 42) return "orange";
    if (h < 68) return "gold";
    if (h < 170) return "green";
    return "cool";
  }

  function invent(spec) {
    const ings = [...new Set(spec.ings)].filter(i => ROLE[i]);
    const by = r => ings.filter(i => ROLE[i] === r), n = r => by(r).length, has = r => n(r) > 0;
    const strong = has("spirit") || has("wine");
    // пропорции: классика держится на 2 частях крепкого, 1 части кислого и 1 части сладкого
    const A = {};
    by("spirit").forEach(i => { A[i] = [50, 30, 20, 15, 15][n("spirit") - 1]; });
    if (n("spirit") === 1 && (has("verm") || has("bitter")) && !has("sour") && !has("juice")) A[by("spirit")[0]] = 40;
    by("wine").forEach(i => { A[i] = has("spirit") ? 60 : 100; });
    by("liq").forEach(i => { A[i] = strong ? 20 : 30; });
    by("bitter").forEach(i => { A[i] = strong ? 25 : 30; });
    by("verm").forEach(i => { A[i] = strong ? 25 : has("bitter") ? 30 : 50; });
    by("sour").forEach(i => { A[i] = n("sour") > 1 ? 10 : 20; });
    by("sweet").forEach(i => { A[i] = n("sweet") > 1 ? 10 : has("sour") ? 15 : 10; });
    by("juice").forEach(i => { A[i] = n("juice") > 1 ? 40 : 60; });
    by("cream").forEach(i => { A[i] = 30; });

    const autoMethod = ings.length === 1 || has("top") || has("mint") || (has("wine") && !has("spirit")) ? "build"
      : has("sour") || has("juice") || has("cream") ? "shake" : "stir";
    const method = spec.method && spec.method !== "auto" ? spec.method : autoMethod;
    const base0 = Object.values(A).reduce((s, v) => s + v, 0);
    let autoCup;
    if (has("wine") && !has("spirit")) autoCup = "wine";
    else if (has("top") || base0 > 130) autoCup = "highball";
    else if (method === "build") autoCup = ings.length === 1 && !has("spirit") && !has("liq") ? "highball" : "rocks";
    else if (method === "shake") autoCup = has("cream") ? "highball" : "coupe";
    else autoCup = ings.includes("vermouthD") && !has("bitter") ? "martini" : has("bitter") || has("dash") ? "rocks" : "coupe";
    const cup = spec.cup && spec.cup !== "auto" ? spec.cup : autoCup;
    const stemmed = cup === "coupe" || cup === "martini";
    let autoIce;
    if (stemmed) autoIce = "none";
    else if (has("mint") && method === "build") autoIce = "crushed";
    else if (cup === "wine") autoIce = has("top") || has("juice") ? "cubes" : "none";
    else if (ings.length === 1 && (has("spirit") || has("liq"))) autoIce = "none";
    else autoIce = "cubes";
    const ice = stemmed ? "none" : spec.ice && spec.ice !== "auto" ? spec.ice : autoIce;

    // всё должно поместиться в бокал вместе с разбавлением и газировкой
    const tops = by("top"), dil = method === "shake" ? .25 : method === "stir" ? .2 : ice !== "none" ? .1 : 0;
    const room = { highball: 200, rocks: 130, coupe: 150, martini: 130, wine: 220 }[cup] - 40 * tops.length;
    const base = Object.values(A).reduce((s, v) => s + v, 0);
    if (base && base * (1 + dil) > room) {
      const k = room / (base * (1 + dil));
      Object.keys(A).forEach(i => { A[i] = round5(A[i] * k); });
    }

    const liquids = ings.filter(i => A[i] != null).sort((a, b) => ROLE_ORDER.indexOf(ROLE[a]) - ROLE_ORDER.indexOf(ROLE[b]));
    const mint = ings.includes("mint") && method === "build", dash = ings.includes("bitters");
    const prog = [];
    const iceGlass = () => { if (ice !== "none") prog.push(ice === "crushed" ? ["ice", "glass", true] : ["ice", "glass"]); };
    const put = i => prog.push(method === "build" && A[i] > 50 ? ["pour", i, A[i]] : ["jig", i, A[i]]);
    if (method === "build") {
      if (mint) {
        prog.push(["leaves"]);
        liquids.filter(i => ROLE[i] === "sour" || ROLE[i] === "sweet").forEach(put);
        prog.push(["muddle"]);
        iceGlass();
        liquids.filter(i => ROLE[i] !== "sour" && ROLE[i] !== "sweet").forEach(put);
      } else { iceGlass(); liquids.forEach(put); }
      if (dash) prog.push(["dash", "bitters", 2]);
      tops.forEach(t => prog.push(["top", t]));
      if (ings.length > 1) prog.push(["stirIn"]);
    } else {
      prog.push(["ice", method === "shake" ? "tin" : "mixer"]);
      liquids.forEach(put);
      if (dash) prog.push(["dash", "bitters", 2]);
      prog.push([method]);
      iceGlass();
      prog.push(["strain"]);
      tops.forEach(t => prog.push(["top", t]));
      if (tops.length) prog.push(["stirIn"]);
    }
    prog.push(["garnish"]);

    const h = i => ings.includes(i);
    const garnish = h("mint") ? "mint" : h("lime") ? (cup === "highball" ? "wedge" : "wheel") : h("lemon") ? "lemon"
      : h("pineapple") || h("coconut") ? "pineapple" : h("oj") || h("campari") || h("vermouthR") || h("triple") ? "orange"
      : h("cherry") ? "cherry" : h("vermouthD") && h("gin") ? "olive" : h("cola") ? "wedge" : h("tonic") || h("soda") ? "wheel"
      : method === "stir" || cup === "rocks" ? "orange" : "lemon";

    const col = blend(liquids.map(i => [LIQ[i], A[i]]).concat(dash ? [[LIQ.bitters, 2]] : [], tops.map(t => [LIQ[t], 70])));
    const key = [ings.slice().sort().join("+"), cup, ice, method].join("|"), hs = hashStr(key);
    const fam = colourFamily(col), adj = NAME_ADJ[fam][hs % 3], noun = NAME_NOUN[(hs >>> 3) % NAME_NOUN.length];
    const id = "u-" + hs.toString(36);

    // вкус: кислое, сладкое, горькое
    const sour = by("sour").reduce((s, i) => s + A[i], 0);
    const sweet = (A.syrup || 0) + (A.grenadine || 0) + by("liq").reduce((s, i) => s + A[i] * .5, 0) + by("juice").reduce((s, i) => s + A[i] * .25, 0)
      + (A.coconut || 0) * .4 + (h("cola") ? 20 : 0) + (h("tonic") ? 8 : 0) + (A.vermouthR || 0) * .3;
    const bitter = (A.campari || 0) + (dash ? 15 : 0) + (h("tonic") ? 10 : 0);
    const taste = [];
    if (sour && sweet) taste.push(sour / sweet > 2 ? "кислый" : sweet / sour > 2.5 ? "сладкий" : "кисло-сладкий");
    else if (sour) taste.push("кислый");
    else if (sweet > 12) taste.push("сладкий");
    if (bitter >= 20) taste.push("горьковатый");
    if (h("coconut")) taste.push("сливочный");
    if (h("mint") || h("soda") || h("tonic")) taste.push("освежающий");
    if (!taste.length) taste.push(has("spirit") ? "сухой и чистый" : "мягкий");

    const c = { id, custom: true, name: spec.name || `${adj} ${noun}`, auto: `${adj} ${noun}`,
      base: by("spirit")[0] || (has("wine") ? "wine" : has("bitter") || has("verm") || has("liq") ? "aperitif" : "none"),
      origin: "Hacheden, ваш рецепт", method, need: ings, cup, ice: cup === "rocks" && ice !== "none",
      pour: col.hex, pourOp: h("coconut") ? .95 : Math.min(.95, Math.max(.45, .42 + (1 - col.lum) * .85)),
      pourLevel: { highball: 30, rocks: 62, coupe: 40, martini: 32, wine: 40 }[cup], garnish, spec: { ings, cup: spec.cup || "auto", ice: spec.ice || "auto", method: spec.method || "auto" } };
    Closeup.PROGRAMS[id] = prog;
    finishDrink(c);
    const strength = c.stats.abv < .5 ? "безалкогольный" : c.stats.abv >= 22 ? "крепкий" : c.stats.abv >= 12 ? "средней крепости" : "лёгкий";
    c.tagline = `Авторский коктейль: ${strength}, ${taste.join(", ")}`;

    c.recipe = liquids.slice().reverse().map(i => [`${A[i]} мл`, Closeup.GEN[i]]);
    if (dash) c.recipe.push(["2 капли", "ангостуры"]);
    tops.forEach(t => c.recipe.push(["до верха", Closeup.GEN[t]]));
    if (mint) c.recipe.unshift(["6–8", "листиков мяты"]);
    c.recipe.push(["1", Closeup.GNAME[garnish]]);
    const glassTo = `в ${GLASS_NAME[cup]}`, topTxt = tops.length ? `, долей ${tops.map(t => Closeup.TOPACC[t]).join(" и ")}` : "";
    const iceTxt = ice === "crushed" ? " с колотым льдом" : ice === "cubes" ? " со льдом" : "";
    c.steps = (method === "build"
      ? (mint ? "Слегка разомни мяту на дне бокала, чтобы она отдала аромат. " : "") + `Налей всё ${glassTo}${iceTxt}${topTxt} и аккуратно перемешай.`
      : method === "shake" ? `Встряхни всё в шейкере со льдом 10–15 секунд и процеди ${glassTo}${ice !== "none" ? " со свежим льдом" : ""}${topTxt}.`
      : `Размешай всё со льдом в стакане для смешивания 20–30 секунд и процеди ${glassTo}${ice !== "none" ? " со свежим льдом" : ""}${topTxt}.`)
      + ` Украшение: ${Closeup.GNAME[garnish]}.`;

    // честный совет бармена
    const tips = [];
    if (sour && !sweet) tips.push("Кислоте нужен противовес. В классике на 2 части крепкого берут 1 часть сока и 1 часть сиропа — добавьте сахарный сироп.");
    if (!sour && sweet > 25 && !bitter && !h("cola")) tips.push("Получилось сладко. Немного лимона или лайма сделает вкус ярче.");
    if (n("spirit") >= 3) tips.push("Три крепких напитка в одном бокале — смело. Бармен уменьшил порции, но пейте медленно.");
    if (method === "stir" && (has("juice") || has("sour") || has("cream"))) tips.push("Соки и сливки обычно встряхивают в шейкере: так напиток становится пышнее и лучше смешивается.");
    if (method === "shake" && !has("juice") && !has("sour") && !has("cream") && ings.length > 1) tips.push("Прозрачные крепкие коктейли бармены размешивают, а не встряхивают — так они остаются кристально чистыми.");
    if (h("wine") && h("cola")) tips.push("Вино с колой — почти калимочо, напиток баскских праздников.");
    if (h("coconut") && (h("tonic") || h("soda") || h("cola"))) tips.push("Кокосовые сливки с газировкой могут расслоиться: лучше обойтись соком.");
    if (ings.length === 1 && has("spirit")) tips.push(`Чистый напиток — честный выбор. Бармен нальёт его ${ice === "none" ? "без льда, чтобы раскрылся аромат" : "на лёд"}.`);
    if (!tips.length) tips.push(`Баланс сошёлся: ${taste.join(", ")}. Бармен одобряет.`);
    c.tip = tips.slice(0, 2).join(" ");
    const day = new Date().toLocaleDateString("ru-RU", { day: "numeric", month: "long" });
    c.history = `Этот рецепт придумали вы${spec.date ? ", " + spec.date : ", " + day}. Бармен подобрал пропорции, способ и бокал, а название предложил по цвету напитка.`;
    c.date = spec.date || day;
    return c;
  }

  const MINE = keepGet("hacheden-mine", []);
  function saveMine() { keepSet("hacheden-mine", MINE.map(m => ({ ings: m.spec.ings, cup: m.spec.cup, ice: m.spec.ice, method: m.spec.method, name: m.name, date: m.date }))); }
  MINE.splice(0, MINE.length, ...MINE.map(s => { const c = invent(s); c.saved = true; addDrink(c); return c; }));

  /* ---------- барная карта ---------- */
  const mixDlg = document.getElementById("mix"), orderBtn = document.getElementById("order");
  const hintEl = document.getElementById("hint"), HINT = hintEl.textContent, served = document.getElementById("served");
  const inShaker = new Set();
  const SERVE = { cup: "auto", ice: "auto", method: "auto" };
  const MENU = { q: "", cat: "all", sort: "base", hint: 0 };
  let mixN = 0;

  const needText = c => c.need.filter(i => ING_NAME[i]).map(low).join(", ");
  function drinkRow(c, side, btn) {
    mixN++;
    return `<li class="drink">${glassSVG(c, { pre: "m" + mixN + "-", still: true })}
      <div><b>${escH(c.name)}</b><span>${needText(c)}</span>${side || ""}</div>${btn}</li>`;
  }
  const makeBtn = c => `<button class="make" type="button" data-make="${c.id}" aria-label="Приготовить: ${escH(c.name)}">Приготовить</button>`;
  const favBtn = c => `<button class="fav" type="button" data-fav="${c.id}" aria-pressed="${FAV.has(c.id)}" aria-label="${FAV.has(c.id) ? "Убрать из избранного" : "В избранное"}: ${escH(c.name)}">${FAV.has(c.id) ? "★" : "☆"}</button>`;
  function menuRow(c) {
    mixN++;
    const badge = c.signature ? `<i class="badge">фирменный</i>` : c.secret ? `<i class="badge">тайный</i>` : c.custom ? `<i class="badge">мой</i>` : "";
    return `<li class="drink${c.signature ? " is-sig" : ""}">${glassSVG(c, { pre: "m" + mixN + "-", still: true })}
      <div><b>${escH(c.name)}${badge}</b><span>${needText(c)}</span><span class="meta">${statText(c.stats)} · ${METHOD_SHORT[c.method]}</span></div>
      ${favBtn(c)}
      <div class="acts"><button class="make ghost" type="button" data-info="${c.id}">Подробнее</button>${makeBtn(c)}</div></li>`;
  }

  /* что получится из шейкера: известный рецепт, тайный или свой */
  const sameSet = (a, b) => a.length === b.length && a.every(i => b.includes(i));
  function shakerMatch() {
    const picked = [...inShaker];
    if (!picked.length) return null;
    const known = COCKTAILS.find(c => !c.custom && sameSet(c.need, picked));
    if (known) return { kind: "known", c: known };
    const secret = SECRETS.find(s => sameSet(s.need, picked));
    if (secret) return { kind: "secret", c: secret, look: invent({ ings: picked, ...SERVE }) };
    if (!picked.some(i => i !== "mint" && i !== "bitters")) return { kind: "thin" };
    return { kind: "custom", c: invent({ ings: picked, ...SERVE }) };
  }
  function renderServe(m) {
    const auto = m && m.kind === "custom" ? m.c : m && m.kind === "secret" ? m.look : null;
    const row = (key, title, opts) => `<div class="serve-row"><span>${title}</span><div class="chips">${opts.map(([v, label, off]) =>
      `<button class="chip" type="button" data-opt="${key}:${v}" aria-pressed="${SERVE[key] === v}"${off ? " disabled" : ""}>${label}</button>`).join("")}</div></div>`;
    const autoLabel = (key, txt) => auto && SERVE[key] === "auto" ? `Авто · ${txt}` : "Авто";
    const stemmed = SERVE.cup === "coupe" || SERVE.cup === "martini";
    document.getElementById("mix-serve").innerHTML = `<h3>Подача</h3>` +
      row("cup", "Бокал", [["auto", autoLabel("cup", auto && CUP_SHORT[auto.cup])], ["highball", "высокий"], ["rocks", "рокс"], ["coupe", "блюдце"], ["martini", "коктейльный"], ["wine", "винный"]]) +

  function renderPreview(m) {

    if (m.kind === "known") { pv.innerHTML = `Бармен узнал рецепт: <b>${escH(m.c.name)}</b> · ${statText(m.c.stats)}`; go.textContent = `Приготовить «${m.c.name}»`; return; }
    const c = m.kind === "secret" ? m.look : m.c;
    pv.innerHTML = `Авторский коктейль · ${statText(c.stats)} · ${c.tagline.split(": ")[1]}`;
    go.textContent = "Смешать";
  }
  function renderMix() {
    mixN = 0;
    const picked = [...inShaker];
    document.getElementById("mix-summary").textContent = picked.length
      ? "В шейкере: " + picked.map(low).join(", ") + "."
      : "Шейкер пока пуст. Отмечай ингредиенты ниже или бери бутылки прямо с полки. Можно повторить классику, а можно придумать свой коктейль.";
    const can = [], almost = [];
    COCKTAILS.forEach(c => {
      const miss = c.need.filter(i => !inShaker.has(i));
      if (!miss.length) can.push(c);
      else if (miss.length === 1 && c.need.length > 1) almost.push([c, miss[0]]);
    });
    let html = "";
    if (picked.length) {
      html += `<h3>Можно приготовить</h3>` + (can.length
        ? `<ul class="drinks">${can.map(c => drinkRow(c, "", makeBtn(c))).join("")}</ul>`
        : `<p class="empty">Готовых рецептов пока нет — но можно смешать свой.</p>`);
      if (almost.length) html += `<h3>Не хватает одного</h3><ul class="drinks">${almost.slice(0, 4).map(([c, m]) =>

      `<h3>${title}</h3><div class="chips">${items.map(([id, name]) =>
        `<button class="chip" type="button" data-ing="${id}" aria-pressed="${inShaker.has(id)}">${name}</button>`).join("")}</div>`).join("");
    const m = shakerMatch();
    renderServe(m);
    renderPreview(m);
    document.querySelectorAll(".bottle").forEach(b => b.classList.toggle("in", inShaker.has(b.dataset.id)));
  }

  /* меню: поиск, разделы, сортировка, избранное */
  const CATS = [
    ["all", "Все", () => true],
    ["sig", "Фирменный", c => c.signature],
    ["classic", "Классика", c => !c.signature && !c.custom && !c.secret && c.base !== "hot"],
    ["fresh", "Освежающие", c => c.cup === "highball" || c.need.some(i => ROLE[i] === "top")],
    ["strong", "Покрепче", c => c.stats.abv >= 20],
    ["zero", "Без алкоголя", c => c.stats.abv < .5],
    ["hot", "Кофе и чай", c => c.base === "hot"],
    ["spirits", "Крепкие напитки", () => false],
    ["wine", "Вино", () => false],
    ["found", "Тайные", c => c.secret],
    ["mine", "Мои", c => c.custom],
    ["fav", "★ Избранное", c => FAV.has(c.id)]
  ];
  const SORTS = [["base", "По разделам"], ["name", "По названию"], ["strong", "Сначала крепкие"], ["light", "Сначала лёгкие"]];
  function menuShell() {
    const p = document.getElementById("panel-menu");
    if (p.querySelector("#menu-q")) return;
    p.innerHTML = `<div class="menu-tools">
        <input type="search" id="menu-q" placeholder="Найти напиток" aria-label="Поиск по меню" autocomplete="off">
        <select id="menu-sort" aria-label="Сортировка">${SORTS.map(([v, t]) => `<option value="${v}">${t}</option>`).join("")}</select>
      </div>
      <div class="chips cats" id="menu-cats" role="group" aria-label="Разделы меню"></div>
      <div id="menu-list" aria-live="polite"></div>
      <div class="secret-hint" id="menu-secret"></div>`;
    p.querySelector("#menu-q").addEventListener("input", e => { MENU.q = e.target.value; renderMenu(); });
    p.querySelector("#menu-sort").addEventListener("change", e => { MENU.sort = e.target.value; renderMenu(); });
  }
  function renderMenu() {
    menuShell();
    mixN = 100;
    const q = MENU.q.trim().toLowerCase();
    const visible = c => !q || c.name.toLowerCase().includes(q) || c.need.some(i => ING_NAME[i] && ING_NAME[i].toLowerCase().includes(q));
    document.getElementById("menu-cats").innerHTML = CATS.map(([id, title, f]) => {
      const n = id === "spirits" ? SHELF.filter(d => d.id !== "wine").length : id === "wine" ? SHELF.filter(d => d.id === "wine").length : COCKTAILS.filter(f).length;
      if ((id === "mine" || id === "fav") && !n && MENU.cat !== id) return "";
      const label = id === "found" ? `${title} ${FOUND.size}/${SECRETS.length}` : id === "all" ? title : `${title} · ${n}`;
      return `<button class="chip" type="button" data-cat="${id}" aria-pressed="${MENU.cat === id}">${label}</button>`;
    }).join("");
    const pass = (CATS.find(c => c[0] === MENU.cat) || CATS[0])[2];
    let list = COCKTAILS.filter(c => pass(c) && visible(c));
    let html = "";
    if (MENU.sort === "base" && !q && MENU.cat === "all") {
      const sig = list.filter(c => c.signature);
      if (sig.length) html += `<h3 class="sig">Фирменный</h3><ul class="drinks sig">${sig.map(menuRow).join("")}</ul>`;
      html += BASES.map(([base, title]) => {
        const l = list.filter(c => c.base === base && !c.signature && !c.custom);
        return l.length ? `<h3>${title}</h3><ul class="drinks">${l.map(menuRow).join("")}</ul>` : "";
      }).join("");
      const mine = list.filter(c => c.custom);
      if (mine.length) html += `<h3>Мои коктейли</h3><ul class="drinks">${mine.map(menuRow).join("")}</ul>`;
    } else {
      if (MENU.sort === "name") list.sort((a, b) => a.name.localeCompare(b.name, "ru"));
      if (MENU.sort === "strong") list.sort((a, b) => b.stats.abv - a.stats.abv);
      if (MENU.sort === "light") list.sort((a, b) => a.stats.abv - b.stats.abv);
      html = list.length ? `<ul class="drinks${MENU.cat === "sig" ? " sig" : ""}">${list.map(menuRow).join("")}</ul>`
        : `<p class="empty">${MENU.cat === "found" ? "Тайные рецепты ещё не найдены." : MENU.cat === "mine" ? "Своих коктейлей пока нет. Смешай что-нибудь во вкладке «Смешать» и сохрани." : MENU.cat === "fav" ? "Отмечай звёздочкой то, что понравилось." : "Ничего не нашлось."}</p>`;
    }
    // бутылки с полки: крепкие напитки и вино
    if (MENU.cat === "spirits" || MENU.cat === "wine" || (MENU.cat === "all" && MENU.sort === "base")) {
      const shelf = SHELF.filter(d => (MENU.cat === "wine" ? d.id === "wine" : MENU.cat === "spirits" ? d.id !== "wine" : true) && (!q || d.name.toLowerCase().includes(q)));
      if (MENU.cat !== "all") html = "";
      if (shelf.length) html += `${MENU.cat === "all" ? "<h3>С полки: крепкое и вино</h3>" : ""}<ul class="drinks">${shelf.map(shelfRow).join("")}</ul>`;
      else if (MENU.cat !== "all") html = `<p class="empty">Ничего не нашлось.</p>`;
    }
    document.getElementById("menu-list").innerHTML = html;
    const left = SECRETS.filter(s => !FOUND.has(s.id));
    const box = document.getElementById("menu-secret");
    if (!left.length) box.innerHTML = `<p><b>Все тайные рецепты найдены.</b> Бармен снимает шляпу.</p>`;
    else {
      const s = left[MENU.hint % left.length];
      box.innerHTML = `<p><b>В баре спрятано ${SECRETS.length} тайных рецептов. Найдено: ${FOUND.size}.</b> Собери нужные ингредиенты во вкладке «Смешать» — и бармен узнает рецепт.</p>
        <p class="hint-line">Подсказка: ${s.hint}</p>${left.length > 1 ? `<button class="clear" type="button" data-hint>Другая подсказка</button>` : ""}`;
    }

  const SHELF = DRINKS;
  function shelfRow(d) {
    mixN++;

    const m = shakerMatch();

    if (m.kind === "secret") {
      if (revealSecret(m.c)) freshFind = m.c.id;
      return makeCocktail(m.c.id);
    }

  }
  mixDlg.addEventListener("close", () => {
    app.classList.remove("mixing");
    if (!busy) hintEl.textContent = HINT;
  });
  orderBtn.addEventListener("click", () => mixDlg.open ? mixDlg.close() : openMix());
  mixDlg.addEventListener("click", e => {
    const t = e.target.closest("button");
    if (!t) return;
    if (t.dataset.ing) toggleIng(t.dataset.ing);
    else if (t.dataset.add) { inShaker.add(t.dataset.add); renderMix(); }
    else if (t.dataset.make) makeCocktail(t.dataset.make);
    else if (t.dataset.info) openCard(COCKTAIL_BY_ID[t.dataset.info], { info: true });
    else if (t.dataset.sinfo) openCard(DRINKS.find(d => d.id === t.dataset.sinfo));
    else if (t.dataset.pour) { const id = t.dataset.pour; mixDlg.close(); hintEl.textContent = HINT; if (H3D.bottle) H3D.bottle(id); }
    else if (t.dataset.fav) { toggleFav(t.dataset.fav); renderMenu(); const f = mixDlg.querySelector(`[data-fav="${t.dataset.fav}"]`); if (f) f.focus(); }
    else if (t.dataset.cat) { MENU.cat = t.dataset.cat; renderMenu(); const f = mixDlg.querySelector(`[data-cat="${MENU.cat}"]`); if (f) f.focus(); }
    else if (t.dataset.opt) { const [k, v] = t.dataset.opt.split(":"); SERVE[k] = v; if (k === "cup" && (v === "coupe" || v === "martini")) SERVE.ice = "auto"; renderMix(); const f = mixDlg.querySelector(`[data-opt="${k}:${v}"]`); if (f) f.focus(); }

    else if ("hint" in t.dataset) { MENU.hint++; renderMenu(); }

  function cardExtras(d, opt) {
    let h = "";

    const acts = [];
    if (d.custom) {
      h += `<div class="mine-box"><label for="mine-name">Название коктейля</label><input id="mine-name" maxlength="32" autocomplete="off" value="${escH(d.name)}"></div>`;
      acts.push(`<button class="make" type="button" data-save="${d.id}">${d.saved ? "Сохранить название" : "Сохранить в «Мои коктейли»"}</button>`);

    }

  dlg.addEventListener("click", e => {

      if (first) track("count", "mine");
      refreshExtras(c, first ? "Сохранено в «Мои коктейли» — ищите в меню." : "Название сохранено.");

      const i = MINE.indexOf(c); if (i >= 0) MINE.splice(i, 1);

  });
  dlg.addEventListener("keydown", e => { if (e.target.id === "mine-name" && e.key === "Enter") { e.preventDefault(); const s = dlg.querySelector("[data-save]"); if (s) s.click(); } });

  async function makeCocktail(id) {
    if (busy) return;

    c.need.forEach(i => inShaker.add(i));
    busy = true;
    mixDlg.close();
    hintEl.textContent = `Бармен готовит: ${c.name}`;
    Bartender.prep();
    if (!reduceMotion.matches) await Closeup.play(c);
    served.innerHTML = glassSVG(c, { pre: "sv-" });
    served.style.left = Bartender.glassX() + "px";

  }
  let LAST_DRINK = null;
  addEventListener("keydown", e => {
    if (e.key === "Escape" && mixDlg.open && !dlg.open) { mixDlg.close(); orderBtn.focus(); }
  });

  
/* ================= панели: общий каркас и настройки ================= */
  /* боковая панель (на телефоне — шторка снизу) с заголовком и крестиком */
  function makeSheet(id, title, extra = "") {
    const d = document.createElement("dialog");
    d.className = "sheet" + (extra ? " " + extra : "");
    d.id = id;
    d.setAttribute("aria-labelledby", id + "-title");
    d.innerHTML = `<div class="sheet-in"><div class="sheet-top"><h2 id="${id}-title">${title}</h2>
      <button class="close" type="button" aria-label="Закрыть" data-sheet-close>×</button></div><div class="sheet-body"></div></div>`;
    document.body.appendChild(d);
    d.addEventListener("click", e => {
      if (e.target === d || e.target.closest("[data-sheet-close]")) d.close();
    });
    d.body = d.querySelector(".sheet-body");
    return d;
  }
  function openSheet(d) {
    if (d.open) return;
    for (const o of document.querySelectorAll("dialog.sheet[open], dialog.atmo[open]")) o.close();
    if (typeof mixDlg !== "undefined" && mixDlg.open) mixDlg.close();
    d.showModal();
    uiSound("open");
    const f = d.querySelector(".sheet-body button, .sheet-body input, .sheet-body select");
    (f || d.querySelector(".close")).focus({ preventScroll: true });
  }
  const pct = v => Math.round(v * 100) + "%";
